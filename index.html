<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyeros González</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f2ee; --surface:#fff; --ink:#15201e; --muted:#5f6a68; --line:#d9d6cf; --gold:#9a7424; --deep:#10201d; --deep-ink:#f1ede4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1514; --surface:#17211f; --ink:#ecebe6; --muted:#9aa5a2; --line:#2a3735; --gold:#d6b25f; --deep:#0a1110; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Karla,system-ui,sans-serif; line-height:1.5; }
  .serif { font-family:"Cormorant Garamond",Georgia,serif; }
  .hero { background:var(--deep); color:var(--deep-ink); padding:72px 20px 64px; text-align:center; background-image:radial-gradient(ellipse at 50% 120%, rgba(214,178,95,.25), transparent 60%); }
  .hero small { display:block; color:#d6b25f; letter-spacing:.18em; font-size:.8rem; margin-bottom:18px; }
  .hero h1 { font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; font-size:clamp(2.8rem,11vw,5.6rem); line-height:.98; margin:0; }
  .hero h1 em { font-weight:500; color:#d6b25f; }
  .hero p { max-width:36ch; margin:18px auto 28px; opacity:.8; font-size:1.05rem; }
  .cta { display:inline-block; background:#d6b25f; color:#10201d; padding:13px 28px; border-radius:2px; font-weight:600; text-decoration:none; }
  section { max-width:1100px; margin:0 auto; padding:48px 16px 0; }
  h2.titulo { font-family:"Cormorant Garamond",Georgia,serif; font-size:2rem; margin:0 0 20px; }
  #cats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:700px) { #cats { grid-template-columns:repeat(4,1fr); } }
  .cat { position:relative; aspect-ratio:4/5; border:0; padding:0; border-radius:3px; overflow:hidden; cursor:pointer; background:linear-gradient(160deg,#2b4a44,#10201d); color:#fff; text-align:left; }
  .cat img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cat span { position:absolute; left:0; right:0; bottom:0; padding:28px 14px 14px; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.4rem; font-weight:600; background:linear-gradient(transparent,rgba(0,0,0,.65)); }
  .cat[aria-pressed="true"] { outline:3px solid var(--gold); outline-offset:2px; }
  #lista { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  @media (min-width:700px) { #lista { grid-template-columns:repeat(3,1fr); gap:20px; } }
  .pieza { display:flex; flex-direction:column; }
  .foto { aspect-ratio:1; background:linear-gradient(150deg,var(--line),var(--surface)); display:flex; align-items:center; justify-content:center; border-radius:3px; overflow:hidden; color:var(--gold); font-family:"Cormorant Garamond",Georgia,serif; font-size:2.4rem; }
  .foto img { width:100%; height:100%; object-fit:cover; }
  .mini { display:flex; gap:6px; margin-top:6px; overflow-x:auto; }
  .mini button { margin:0; padding:0; width:52px; height:52px; flex:none; border:2px solid transparent; border-radius:2px; overflow:hidden; background:var(--line); }
  .mini button[aria-pressed="true"] { border-color:var(--gold); }
  .mini img { width:100%; height:100%; object-fit:cover; display:block; }
  .info { padding:12px 2px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .info h3 { font-family:"Cormorant Garamond",Georgia,serif; font-size:1.35rem; margin:0; line-height:1.15; }
  .desc { color:var(--muted); font-size:.88rem; margin:0; flex:1; }
  .quil { display:flex; gap:6px; flex-wrap:wrap; }
  .quil button { margin:0; padding:5px 11px; background:transparent; color:var(--ink); border:1px solid var(--line); font-size:.85rem; font-weight:400; }
  .quil button[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold); }
  .precio { font-size:1.1rem; font-weight:600; }
  .stock { font-size:.78rem; color:var(--muted); }
  button { font:inherit; cursor:pointer; border:0; border-radius:2px; padding:11px 14px; background:var(--ink); color:var(--bg); font-weight:600; margin-top:6px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button:focus-visible, .cta:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  dialog { border:1px solid var(--line); border-radius:4px; background:var(--surface); color:var(--ink); padding:22px; width:min(92vw,420px); }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  dialog h3 { font-family:"Cormorant Garamond",Georgia,serif; font-size:1.6rem; margin:0 0 4px; }
  dialog label { display:block; font-size:.85rem; color:var(--muted); margin-top:12px; }
  dialog input, dialog textarea { width:100%; font:inherit; padding:10px; border:1px solid var(--line); border-radius:3px; background:var(--bg); color:var(--ink); margin-top:4px; }
  dialog .fila { display:flex; gap:8px; }
  dialog .fila button { flex:1; }
  dialog .sec { background:transparent; color:var(--ink); border:1px solid var(--line); }
  #err { color:#b3261e; font-size:.9rem; min-height:1.2em; margin-top:10px; }
  #msg-ok { padding:8px 0; }
  main { padding-bottom:130px; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:40px 16px 140px; }
  #carrito { position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding:12px 16px; display:none; align-items:center; justify-content:space-between; gap:12px; }
  #carrito.visible { display:flex; }
  #carrito button { margin:0; }
  #msg { text-align:center; color:var(--muted); padding:40px 0; grid-column:1/-1; }
</style>
</head>
<body>
<header class="hero">
  <small>JOYEROS GONZÁLEZ</small>
  <h1>Oro y diamantes,<br><em>a tu medida</em></h1>
  <p>Piezas de oro de catálogo y anillos de diamante en quilates estándar.</p>
  <a class="cta" href="#catalogo">Ver catálogo</a>
</header>

<section>
  <h2 class="titulo">Categorías</h2>
  <div id="cats"></div>
</section>

<main>
  <section id="catalogo">
    <h2 class="titulo" id="titulo-lista">Todas las piezas</h2>
    <div id="lista"><div id="msg">Cargando piezas…</div></div>
  </section>
</main>
<footer>Joyeros González · México</footer>
<dialog id="dlg">
  <div id="paso-form">
    <h3>Finalizar compra</h3>
    <div id="dlg-total" class="stock"></div>
    <form id="form-compra">
      <label>Nombre completo<input id="f-nombre" required maxlength="120" autocomplete="name"></label>
      <label>Teléfono / WhatsApp<input id="f-tel" required type="tel" maxlength="30" autocomplete="tel"></label>
      <label>Dirección de entrega<textarea id="f-dir" required rows="3" maxlength="300" autocomplete="street-address"></textarea></label>
      <div id="err" role="alert"></div>
      <div class="fila">
        <button type="button" class="sec" id="f-cancelar">Cancelar</button>
        <button type="submit" id="f-enviar">Confirmar pedido</button>
      </div>
      <div class="stock" style="margin-top:10px">Pago simulado: por ahora no se cobra nada.</div>
    </form>
  </div>
  <div id="paso-ok" hidden>
    <h3>¡Pedido recibido!</h3>
    <p id="msg-ok"></p>
    <button id="ok-cerrar">Cerrar</button>
  </div>
</dialog>
<div id="carrito"><span id="resumen"></span><button id="btn-comprar">Comprar</button></div>

<script>
  var SUPABASE_URL = "https://wppvzacfeqhrrjwuibmg.supabase.co";
  var SUPABASE_KEY = "sb_publishable_s62dCxrPV1F0sZE_eVgBCw_UbMCg46i";
  var NOMBRES = { compromiso:"Anillos de compromiso", anillos:"Anillos", collares:"Collares", aretes:"Aretes", pulseras:"Pulseras", dijes:"Dijes", oro:"Oro", diamantes:"Diamantes" };

  var piezas = [], grupos = [], carrito = {}, categoria = "todo";
  function dinero(n) { return Number(n).toLocaleString("es-MX", { style:"currency", currency:"MXN" }); }
  function etiqueta(c) { return NOMBRES[c] || c.charAt(0).toUpperCase() + c.slice(1); }

  function agrupar() {
    var mapa = {}; grupos = [];
    piezas.forEach(function (p) {
      p.categoria = p.categoria || "oro";
      var k = p.categoria + "|" + p.nombre;
      if (!mapa[k]) { mapa[k] = { nombre:p.nombre, categoria:p.categoria, opciones:[] }; grupos.push(mapa[k]); }
      mapa[k].opciones.push(p);
    });
    grupos.forEach(function (g) { g.opciones.sort(function (a, b) { return (a.quilates||0) - (b.quilates||0); }); });
  }

  function pintarCategorias() {
    var cont = document.getElementById("cats");
    cont.textContent = "";
    var vistas = [];
    piezas.forEach(function (p) { if (vistas.indexOf(p.categoria) < 0) vistas.push(p.categoria); });
    [["todo","Todo"]].concat(vistas.map(function (c) { return [c, etiqueta(c)]; })).forEach(function (par) {
      var b = document.createElement("button");
      b.className = "cat"; b.setAttribute("aria-pressed", par[0] === categoria ? "true" : "false");
      var foto = piezas.filter(function (p) { return p.foto_url && (par[0] === "todo" || p.categoria === par[0]); })[0];
      if (foto) { var i = document.createElement("img"); i.src = foto.foto_url; i.alt = ""; b.appendChild(i); }
      var s = document.createElement("span"); s.textContent = par[1]; b.appendChild(s);
      b.addEventListener("click", function () {
        categoria = par[0]; pintarCategorias(); mostrar();
        document.getElementById("catalogo").scrollIntoView({ behavior:"smooth" });
      });
      cont.appendChild(b);
    });
  }

  function tarjeta(g) {
    var sel = g.opciones[0];
    var el = document.createElement("article"); el.className = "pieza";
    var foto = document.createElement("div"); foto.className = "foto";
    var mini = document.createElement("div"); mini.className = "mini";
    var fi = 0;
    var info = document.createElement("div"); info.className = "info";
    var h = document.createElement("h3"); h.textContent = g.nombre;
    var d = document.createElement("p"); d.className = "desc";
    var quil = document.createElement("div"); quil.className = "quil";
    var pr = document.createElement("div"); pr.className = "precio";
    var st = document.createElement("div"); st.className = "stock";
    var b = document.createElement("button"); b.textContent = "Agregar al carrito";
    b.addEventListener("click", function () { agregar(sel); });

    function pintar() {
      var imgs = [];
      if (sel.foto_url) imgs.push(sel.foto_url);
      if (sel.fotos_extra) sel.fotos_extra.split(",").forEach(function (u) { u = u.trim(); if (u) imgs.push(u); });
      if (fi >= imgs.length) fi = 0;
      foto.textContent = "";
      if (imgs.length) { var i = document.createElement("img"); i.src = imgs[fi]; i.alt = g.nombre; foto.appendChild(i); }
      else foto.textContent = "JG";
      mini.textContent = "";
      if (imgs.length > 1) imgs.forEach(function (u, n) {
        var mb = document.createElement("button"); mb.setAttribute("aria-label", "Foto " + (n + 1));
        mb.setAttribute("aria-pressed", n === fi ? "true" : "false");
        var mi = document.createElement("img"); mi.src = u; mi.alt = ""; mb.appendChild(mi);
        mb.addEventListener("click", function () { fi = n; pintar(); });
        mini.appendChild(mb);
      });
      d.textContent = sel.descripcion || "";
      pr.textContent = dinero(sel.precio);
      st.textContent = sel.stock > 0 ? "Disponibles: " + sel.stock : "Agotada";
      b.disabled = sel.stock < 1;
      Array.prototype.forEach.call(quil.children, function (q, idx) { q.setAttribute("aria-pressed", g.opciones[idx] === sel ? "true" : "false"); });
    }
    if (g.opciones[0].quilates) {
      g.opciones.forEach(function (o) {
        var q = document.createElement("button"); q.textContent = o.quilates + " ct";
        q.addEventListener("click", function () { sel = o; fi = 0; pintar(); });
        quil.appendChild(q);
      });
    }
    info.append(h, d);
    if (quil.children.length) info.appendChild(quil);
    info.append(pr, st, b);
    el.append(foto, mini, info); pintar();
    return el;
  }

  function mostrar() {
    var lista = document.getElementById("lista"); lista.textContent = "";
    document.getElementById("titulo-lista").textContent = categoria === "todo" ? "Todas las piezas" : etiqueta(categoria);
    grupos.filter(function (g) { return categoria === "todo" || g.categoria === categoria; })
      .forEach(function (g) { lista.appendChild(tarjeta(g)); });
  }

  function agregar(p) {
    var n = carrito[p.id] || 0;
    if (n >= p.stock) return;
    carrito[p.id] = n + 1; actualizarCarrito();
  }
  function actualizarCarrito() {
    var total = 0, cuenta = 0;
    piezas.forEach(function (p) { var c = carrito[p.id] || 0; total += c * p.precio; cuenta += c; });
    document.getElementById("carrito").classList.toggle("visible", cuenta > 0);
    document.getElementById("resumen").textContent = cuenta + (cuenta === 1 ? " pieza · " : " piezas · ") + dinero(total);
  }
  var dlg = document.getElementById("dlg");
  document.getElementById("btn-comprar").addEventListener("click", function () {
    var total = 0; piezas.forEach(function (p) { total += (carrito[p.id] || 0) * p.precio; });
    document.getElementById("dlg-total").textContent = "Total: " + dinero(total);
    document.getElementById("paso-form").hidden = false;
    document.getElementById("paso-ok").hidden = true;
    document.getElementById("err").textContent = "";
    dlg.showModal();
  });
  document.getElementById("f-cancelar").addEventListener("click", function () { dlg.close(); });
  document.getElementById("ok-cerrar").addEventListener("click", function () { dlg.close(); });

  document.getElementById("form-compra").addEventListener("submit", async function (e) {
    e.preventDefault();
    var btn = document.getElementById("f-enviar"), err = document.getElementById("err");
    err.textContent = ""; btn.disabled = true; btn.textContent = "Enviando…";
    var items = Object.keys(carrito).map(function (id) { return { id: Number(id), cantidad: carrito[id] }; });
    try {
      var r = await fetch("/.netlify/functions/crear-pedido", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: items, cliente: {
          nombre: document.getElementById("f-nombre").value,
          telefono: document.getElementById("f-tel").value,
          direccion: document.getElementById("f-dir").value } })
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || "No se pudo crear el pedido");
      carrito = {}; actualizarCarrito();
      document.getElementById("msg-ok").textContent = "Gracias. Tu pedido quedó registrado (n.º " + d.pedidos.join(", ") + "). Te contactaremos por WhatsApp.";
      document.getElementById("paso-form").hidden = true;
      document.getElementById("paso-ok").hidden = false;
      document.getElementById("form-compra").reset();
      cargar();
    } catch (x) { err.textContent = x.message; }
    btn.disabled = false; btn.textContent = "Confirmar pedido";
  });

  async function cargar() {
    var msg = document.getElementById("msg") || document.createElement("div");
    try {
      var res = await fetch(SUPABASE_URL + "/rest/v1/piezas?select=*&activa=eq.true&order=created_at.asc", { headers:{ apikey:SUPABASE_KEY } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      piezas = await res.json();
      if (!piezas.length) { msg.textContent = "Aún no hay piezas disponibles."; return; }
      piezas.forEach(function (p) { p.categoria = p.categoria || "oro"; });
      agrupar(); pintarCategorias(); mostrar();
    } catch (e) { msg.textContent = "No se pudo cargar el catálogo. Intenta de nuevo en unos minutos."; console.error(e); }
  }
  cargar();
</script>
</body>
</html>
