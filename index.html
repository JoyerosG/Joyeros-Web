<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyería</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4f1; --surface: #ffffff; --ink: #1f2428; --muted: #6b7279;
    --line: #dcd8d2; --accent: #2f4f4a; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16191b; --surface: #1f2427; --ink: #eceae6; --muted: #9aa1a7;
      --line: #343b3f; --accent: #8fb8af; --accent-ink: #14201e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Karla, system-ui, sans-serif; line-height: 1.5; }
  header { padding: 40px 20px 24px; text-align: center; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 2.6rem; margin: 0; letter-spacing: .02em; }
  header p { color: var(--muted); margin: 6px 0 0; }
  main { max-width: 1000px; margin: 0 auto; padding: 0 16px 120px; }
  #lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .pieza { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
  .foto { aspect-ratio: 1; background: var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .85rem; }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .info { padding: 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .info h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.35rem; margin: 0; }
  .desc { color: var(--muted); font-size: .9rem; margin: 0; flex: 1; }
  .precio { font-weight: 600; margin-top: 6px; }
  .stock { font-size: .8rem; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 4px; padding: 10px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; margin-top: 8px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #carrito { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px; display: none; align-items: center; justify-content: space-between; gap: 12px; }
  #carrito.visible { display: flex; }
  #carrito button { margin: 0; }
  #msg { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>Joyería</h1>
  <p>Piezas hechas a mano</p>
</header>
<main>
  <div id="msg">Cargando piezas…</div>
  <div id="lista"></div>
</main>
<div id="carrito">
  <span id="resumen"></span>
  <button id="btn-comprar">Comprar</button>
</div>

<script>
  var SUPABASE_URL = "https://wppvzacfeqhrrjwuibmg.supabase.co";
  var SUPABASE_KEY = "sb_publishable_s62dCxrPV1F0sZE_eVgBCw_UbMCg46i";

  var piezas = [];
  var carrito = {}; // id -> cantidad

  function dinero(n) {
    return Number(n).toLocaleString("es-MX", { style: "currency", currency: "MXN" });
  }

  function crearTarjeta(p) {
    var el = document.createElement("article");
    el.className = "pieza";

    var foto = document.createElement("div");
    foto.className = "foto";
    if (p.foto_url) {
      var img = document.createElement("img");
      img.src = p.foto_url;
      img.alt = p.nombre;
      foto.appendChild(img);
    } else {
      foto.textContent = "Sin foto";
    }

    var info = document.createElement("div");
    info.className = "info";
    var h = document.createElement("h2");
    h.textContent = p.nombre;
    var d = document.createElement("p");
    d.className = "desc";
    d.textContent = p.descripcion || "";
    var pr = document.createElement("div");
    pr.className = "precio";
    pr.textContent = dinero(p.precio);
    var st = document.createElement("div");
    st.className = "stock";
    st.textContent = p.stock > 0 ? "Disponibles: " + p.stock : "Agotada";
    var b = document.createElement("button");
    b.textContent = "Agregar al carrito";
    b.disabled = p.stock < 1;
    b.addEventListener("click", function () { agregar(p); });

    info.append(h, d, pr, st, b);
    el.append(foto, info);
    return el;
  }

  function agregar(p) {
    var actual = carrito[p.id] || 0;
    if (actual >= p.stock) return;
    carrito[p.id] = actual + 1;
    actualizarCarrito();
  }

  function actualizarCarrito() {
    var total = 0, cuenta = 0;
    piezas.forEach(function (p) {
      var c = carrito[p.id] || 0;
      total += c * p.precio;
      cuenta += c;
    });
    var barra = document.getElementById("carrito");
    barra.classList.toggle("visible", cuenta > 0);
    document.getElementById("resumen").textContent =
      cuenta + (cuenta === 1 ? " pieza · " : " piezas · ") + dinero(total);
  }

  document.getElementById("btn-comprar").addEventListener("click", function () {
    // El pago con Mercado Pago se conecta más adelante.
    alert("El pago se conectará en un siguiente paso.");
  });

  async function cargar() {
    var msg = document.getElementById("msg");
    try {
      var url = SUPABASE_URL + "/rest/v1/piezas?select=*&activa=eq.true&order=created_at.desc";
      var res = await fetch(url, { headers: { apikey: SUPABASE_KEY } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      piezas = await res.json();
      if (!piezas.length) {
        msg.textContent = "Aún no hay piezas disponibles.";
        return;
      }
      msg.remove();
      var lista = document.getElementById("lista");
      piezas.forEach(function (p) { lista.appendChild(crearTarjeta(p)); });
    } catch (e) {
      msg.textContent = "No se pudo cargar el catálogo. Intenta de nuevo en unos minutos.";
      console.error(e);
    }
  }
  cargar();
</script>
</body>
</html>
